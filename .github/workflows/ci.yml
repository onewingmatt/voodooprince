name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: cd client && npm ci && cd ..

      - name: Lint
        run: npm run lint

      - name: Build client
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Gameplay integration tests
        run: npm run test:gameplay
